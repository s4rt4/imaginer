[package]
name = "imaginer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate must never gain a UI dependency. Decode, cache and edit logic live
# here so they stay testable without spinning up a window.
[dependencies]
# Named one by one rather than taking the default set, which drags in AVIF encoding
# (ravif), OpenEXR and more — a large build-time and binary-size cost for formats
# nothing here opens. Add features as phases land, and add the extension to
# `decode::SUPPORTED_EXTENSIONS` in the same commit: a decoder nothing lists is a
# decoder the open dialog and the folder listing both refuse to use.
image = { version = "0.25.10", default-features = false, features = [
    "ico",
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
    # Phase 3. TIFF is what scanners and Photoshop write; farbfeld costs almost
    # nothing to carry, being a header and raw samples.
    "tiff",
    "ff",
    # AVIF was evaluated for Phase 4 and rejected: decode needs the `avif-native`
    # feature, which builds dav1d from C and wants pkg-config plus a system
    # library (or nasm and meson). Measured here 2026-08-26 — the build fails
    # without C toolchain setup no personal machine should need for a viewer.
    # The extension stays off SUPPORTED_EXTENSIONS: the list is a promise.
] }
kamadak-exif = "0.6.1"
thiserror = "2.0.19"

# SVG, which `image` does not do and never will — it is a renderer's job, not a
# decoder's. Text is left on: an SVG whose lettering silently vanished would be a
# wrong picture rather than an unsupported one, and this is a tool for people who
# put type in their artwork. What that costs is fontdb, and it is loaded lazily on
# the first SVG a session opens — never during startup. See `svg::system_fonts`.
resvg = "0.47"

# libwebp, for lossy WebP with a quality setting. `image` cannot encode WebP at all
# and `image-webp` is lossless-only, and lossless defeats the point: the reason to
# write WebP here is a smaller file for the web.
webp = "0.3.1"

# PSD is parsed by hand in `psd.rs` — the flattened composite Photoshop writes
# for compatibility is a header, three skip-lengths and planar samples (raw or
# PackBits), and the one crate that reads it had an uncompressed-path bug that
# silently dropped the last channel. Layers and blend modes are a compositor's
# job and deliberately not attempted.
