[package]
name = "imaginer-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "imaginer"
path = "src/main.rs"

[dependencies]
imaginer-core = { path = "../imaginer-core" }

# `default-features = false` matters for startup: the default set pulls in
# `default_fonts` (Ubuntu + Hack + an emoji font, ~1-2MB) whose atlas is built
# during init. We load one system font instead.
eframe = { version = "0.35.0", default-features = false, features = ["glow"] }

# Only so `IMAGINER_TRACE_INIT` can capture eframe's own debug logging, which is the
# one window into the setup phases we cannot instrument ourselves. Already in the
# dependency graph via eframe, and without a logger installed a `log` call is a
# predictable branch on an atomic — nothing that shows up in startup.
log = "0.4"

# Native file dialogs. `default-features = false` drops the xdg-portal and Wayland
# backends, which are Linux-only and unreachable from here.
rfd = { version = "0.17.2", default-features = false }

# Clipboard, text and pixels. `image-data` was kept off on the grounds that it pulls
# a second copy of `image` — checked when copy-image landed, and on Windows it does
# not: arboard asks for `image` 0.25 with png+bmp, which unifies with the one
# `imaginer-core` already builds. What it actually adds is `Win32_Graphics_Gdi`, for
# the DIBV5 conversion that an image on the Windows clipboard is.
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }

# Deleting goes to the Recycle Bin, never `fs::remove_file` — an image viewer that
# can silently destroy an original is not a tool anyone should trust.
trash = "5.2.6"

# Pinned to the version eframe itself resolves, so `CreationContext`'s handle and
# ours are the same type rather than two incompatible copies of it.
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
# `DwmSetWindowAttribute` for the dark title bar; the console functions that let
# `--convert` print to the terminal that launched it despite this being a
# GUI-subsystem binary; and named pipes, which is how the processes Explorer starts
# for a multi-select elect one of themselves to do the conversion.
windows-sys = { version = "0.61.2", features = [
    "Win32_Graphics_Dwm",
    # `Win32_Security` and `Win32_System_IO` are here only because the pipe
    # functions name `SECURITY_ATTRIBUTES` and `OVERLAPPED` in their signatures —
    # we pass null for both.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[build-dependencies]
# Rasterises the logo SVGs at build time so the shipping binary carries pixels, not
# an SVG renderer. `text` is off because the artwork is all paths -- that drops
# fontdb and its font enumeration from the build entirely.
resvg = { version = "0.47", default-features = false }

# The `.ico` embedded as the executable's Win32 icon resource is written by our own
# encoder rather than a second one kept in step by hand -- the SVG stays the single
# source of truth, and the icon Explorer shows is the same code path the Convert
# menu produces files with.
imaginer-core = { path = "../imaginer-core" }

[target.'cfg(windows)'.build-dependencies]
# Drives the Windows SDK resource compiler, which is the only way to attach an icon
# to the executable itself. The runtime window icon is a separate thing entirely and
# does nothing for Explorer, shortcuts, or the shell's own menus.
winresource = "0.1"

[features]
default = []
# Compiles the wgpu backend alongside glow so `IMAGINER_RENDERER=wgpu` can be
# measured against it on new hardware. Off by default because it roughly doubles
# build time, and glow won by 2.6x on the machine this was developed on.
compare-renderers = ["eframe/wgpu"]
